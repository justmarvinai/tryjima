<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>Jima — Captions and motion graphics for short-form video</title>
    <meta

    <meta property="og:site_name" content="Jima" />

      property="og:description"
      content="On-device auto-captions and 445 motion-graphics templates. Free, no account, and your footage never leaves your device."

    <!--
      Paint the dark ground before the CSS bundle arrives. Without this the
      browser flashes its default white canvas for a frame on a cold load,
      which on a near-black site is the most noticeable thing on the page.
    -->
    <style>
      html,
      body {
        background: #08090b;
      }
    </style>
